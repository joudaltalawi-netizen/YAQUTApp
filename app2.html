<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دفتر الحسابات الخرافي - YAQUT</title>
    <!-- استدعاء مكتبة تحويل الجدول لصورة PNG -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1c1c1c;
            --border: #333;
            --green: #00b894;
            --red: #e17055;
            --white: #f5f6fa;
            --gold: #fdcb6e;
            --blue: #0984e3;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--white);
            padding: 15px;
        }

        /* الهيدر */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: var(--card);
            padding: 15px;
            border-radius: 10px;
        }

        .top-bar h1 {
            color: var(--gold);
            font-size: 26px;
        }

        .search-box {
            width: 350px;
            padding: 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--white);
            font-size: 15px;
        }

        .search-box:focus { outline: 2px solid var(--green); }

        /* أدوات الحفظ */
        .save-tools {
            display: flex;
            gap: 15px;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--green);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { transform: translateY(-2px); }

        .btn-blue { background: var(--blue); }
        .btn-gold { background: var(--gold); color: var(--bg); }
        .btn-red { background: var(--red); }

        /* منصة تسجيل */
        .input-panel {
            background: var(--card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .input-panel h2 {
            color: var(--green);
            margin-bottom: 10px;
            font-size: 18px;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
            align-items: end;
        }

        .field {
            flex: 1;
            min-width: 100px;
        }

        .field label {
            display: block;
            margin-bottom: 4px;
            color: #aaa;
            font-size: 12px;
        }

        .field input {
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--white);
            font-size: 16px;
            text-align: center;
        }

        .field input:focus { outline: 2px solid var(--green); }

        /* إخفاء أسهم الأرقام */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* الأعمدة المخصصة */
        .custom-col-header {
            position: relative;
            background: rgba(253, 203, 110, 0.15);
            color: var(--gold);
            font-size: 13px;
            padding: 10px;
        }

        .small-x {
            position: absolute;
            top: 2px;
            right: 2px;
            background: var(--red);
            color: white;
            border: none;
            padding: 2px 4px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 9px;
        }

        /* الجدول */
        .table-container {
            background: var(--card);
            border-radius: 10px;
            overflow-x: auto;
            padding: 5px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 5px;
            text-align: center;
        }

        th { background: rgba(255,255,255,0.05); color: var(--gold); font-size: 13px; }
        td { color: var(--white); font-size: 14px; }

        .td-name {
            text-align: right;
            font-weight: bold;
            color: var(--gold);
            font-size: 15px;
            min-width: 200px;
        }

        .money-td { color: var(--green); font-weight: bold; font-size: 16px; }

        /* وضع التعديل */
        .edit-mode td {
            background: rgba(253, 203, 110, 0.1);
            color: var(--gold);
        }

        .edit-input {
            width: 80px;
            padding: 4px;
            background: rgba(255,255,255,0.2);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--white);
            font-size: 14px;
        }

        /* الإجماليات */
        .totals-row td {
            background: rgba(0, 184, 148, 0.2);
            font-weight: bold;
            color: var(--white);
        }

        .net-row td {
            background: rgba(253, 203, 110, 0.15);
            font-weight: bold;
        }

        .search-result {
            background: rgba(0, 184, 148, 0.1);
            color: var(--green);
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1>📒 دفتر الحسابات الخرافي</h1>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" class="search-box" id="searchInput" placeholder="🔍 ابحث عن اسم زبون..." oninput="searchCustomer()">
        </div>
    </div>

    <!-- أدوات الحفظ -->
    <div class="save-tools">
        <button class="btn btn-blue" onclick="saveAsPNG()">💾 حفظ كصورة (باسم)</button>
        <button class="btn btn-gold" onclick="saveAsTXT()">📁 حفظ نسخة JSON (باسم)</button>
        <button class="btn btn-red" onclick="loadFromFile()">📂 استرجاع نسخة JSON</button>
        <button class="btn" onclick="window.print()">🖨️ حفظ كصورة (PDF)</button>
    </div>

    <!-- منصة تسجيل زبون جديد -->
    <div class="input-panel">
        <h2>➕ تسجيل زبون جديد</h2>
        
        <div class="flex-row">
            <div class="field" style="flex: 2;">
                <label>اسم الزبون</label>
                <input type="text" id="custName" placeholder="مثال: محمد علي">
            </div>
            <div class="field">
                <label>دولار لنا</label>
                <input type="number" id="usd_for_us" placeholder="0">
            </div>
            <div class="field">
                <label>دولار له</label>
                <input type="number" id="usd_for_him" placeholder="0">
            </div>
            <div class="field">
                <label>سوري لنا</label>
                <input type="number" id="syp_for_us" placeholder="0">
            </div>
            <div class="field">
                <label>سوري له</label>
                <input type="number" id="syp_for_him" placeholder="0">
            </div>
            <div class="field">
                <label>ملاحظات</label>
                <input type="text" id="custNotes" placeholder="اختياري">
            </div>
        </div>

        <!-- رح تنضاف أعمدة إضافية حسب الطلب -->
        <div id="customInputsContainer" class="flex-row" style="margin-bottom: 10px;"></div>

        <button class="btn" style="width: 100%;" onclick="registerCustomer()">✅ تسجيل الزبون (عبر Enter)</button>
    </div>

    <!-- لإضافة عمود مخصص -->
    <div style="margin: 10px 0;">
        <button class="btn btn-gold" onclick="addCustomColumn()">➕ إضافة خانة جديدة (مثل ذهب، يورو)</button>
    </div>

    <!-- الجدول الذي سيتم تحويله لصورة -->
    <div id="tableToCapture" class="table-container">
        <table id="ledgerTable">
            <thead id="tableHeader"></thead>
            <tbody id="tableBody">
                <tr>
                    <td colspan="10" style="text-align: center; color: #aaa;">لا يوجد زبائن مسجلين بعد</td>
                </tr>
            </tbody>
            <tfoot id="tableFooter"></tfoot>
        </table>
    </div>

    <script>
        // قائمة الأعمدة المخصصة
        let customColumns = [];
        let searchQuery = "";
        let editingIndex = -1;

        // ***** نظام حفظ احتياطي ذكي *****
        function saveState() {
            const state = JSON.parse(localStorage.getItem('customers_ledger')) || { customColumns: [], customers: [] };
            state.customColumns = customColumns;
            localStorage.setItem('customers_ledger', JSON.stringify(state));
        }

        // تسجيل زبون جديد = نسخة احتياطية تلقائية
        function registerCustomer() {
            const name = document.getElementById('custName').value.trim();
            
            if (name === "") {
                alert("الرجاء كتابة اسم الزبون أولاً!");
                return;
            }

            const usd_for_us = parseFloat(document.getElementById('usd_for_us').value) || 0;
            const usd_for_him = parseFloat(document.getElementById('usd_for_him').value) || 0;
            const syp_for_us = parseFloat(document.getElementById('syp_for_us').value) || 0;
            const syp_for_him = parseFloat(document.getElementById('syp_for_him').value) || 0;
            const notes = document.getElementById('custNotes').value.trim() || "-";

            const customData = {};
            customColumns.forEach(col => {
                const us = parseFloat(document.getElementById(col.id + '_us').value) || 0;
                const him = parseFloat(document.getElementById(col.id + '_him').value) || 0;
                customData[col.id] = { us: us, him: him };
            });

            const state = JSON.parse(localStorage.getItem('customers_ledger')) || { customColumns: [], customers: [] };
            state.customColumns = customColumns;
            state.customers.push({
                name: name,
                usd_for_us: usd_for_us,
                usd_for_him: usd_for_him,
                syp_for_us: syp_for_us,
                syp_for_him: syp_for_him,
                notes: notes,
                customData: customData
            });

            localStorage.setItem('customers_ledger', JSON.stringify(state));
            
            document.getElementById('custName').value = '';
            document.getElementById('usd_for_us').value = '';
            document.getElementById('usd_for_him').value = '';
            document.getElementById('syp_for_us').value = '';
            document.getElementById('syp_for_him').value = '';
            document.getElementById('custNotes').value = '';
            
            customColumns.forEach(col => {
                document.getElementById(col.id + '_us').value = '';
                document.getElementById(col.id + '_him').value = '';
            });

            document.getElementById('custName').focus();
            renderTable();
        }

        // حفظ الجدول كصورة PNG مع خيار "حفظ باسم"
        function saveAsPNG() {
            const element = document.getElementById('tableToCapture');
            html2canvas(element, { backgroundColor: '#1c1c1c' }).then(canvas => {
                const link = document.createElement('a');
                const name = prompt("اكتب اسم الصورة:", "الجدول_اليومي");
                link.download = name + ".png";
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }

        // حفظ نسخة احتياطية JSON مع خيار "حفظ باسم"
        function saveAsTXT() {
            const state = JSON.parse(localStorage.getItem('customers_ledger')) || { customColumns: [], customers: [] };
            const dataStr = JSON.stringify(state, null, 2);

            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;

            const name = prompt("اكتب اسم النسخة الاحتياطية:", "نسخة_الزبائن");
            a.download = name + ".json";

            a.click();
            URL.revokeObjectURL(url);
            alert("تم حفظ النسخة باسم: " + a.download);
        }

        // استرجاع النسخة من الجهاز (JSON)
        function loadFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = event => {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const state = JSON.parse(e.target.result);
                    localStorage.setItem('customers_ledger', JSON.stringify(state));
                    customColumns = state.customColumns;
                    loadCustomInputs();
                    renderTable();
                    alert("تم استرجاع النسخة بنجاح!");
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // إضافة عمود مخصص
        function addCustomColumn() {
            const name = prompt("ما اسم العملة أو الخانة الجديدة؟ (مثل: ذهب، يورو)");
            if (name && name.trim() !== "") {
                const id = 'custom_' + Date.now();
                customColumns.push({ id: id, label: name });
                loadCustomInputs();
                saveState();
                renderTable();
            }
        }

        // حذف عمود مخصص
        function removeCustomColumn(index) {
            if (confirm("هل تريد حذف هذا العمود؟")) {
                customColumns.splice(index, 1);
                loadCustomInputs();
                saveState();
                renderTable();
            }
        }

        // تحميل الأعمدة المخصصة
        function loadCustomInputs() {
            const container = document.getElementById('customInputsContainer');
            container.innerHTML = '';
            
            customColumns.forEach((col, index) => {
                const div = document.createElement('div');
                div.className = 'field';
                div.style.minWidth = '110px';
                div.innerHTML = `
                    <label>${col.label} لنا <button class="small-x" onclick="removeCustomColumn(${index})">X</button></label>
                    <input type="number" id="${col.id}_us" placeholder="0">
                `;
                container.appendChild(div);

                const div2 = document.createElement('div');
                div2.className = 'field';
                div2.style.minWidth = '110px';
                div2.innerHTML = `
                    <label>${col.label} له <button class="small-x" onclick="removeCustomColumn(${index})">X</button></label>
                    <input type="number" id="${col.id}_him" placeholder="0">
                `;
                container.appendChild(div2);
            });
        }

        // رسم الجدول حسب البحث
        function renderTable() {
            const state = JSON.parse(localStorage.getItem('customers_ledger')) || { customColumns: [], customers: [] };
            const customers = state.customers;
            customColumns = state.customColumns;

            let displayedCustomers = customers;
            if (searchQuery.trim() !== "") {
                displayedCustomers = customers.filter(cust => cust.name.toLowerCase().includes(searchQuery.toLowerCase()));
            }

            const thead = document.getElementById('tableHeader');
            thead.innerHTML = `
                <tr>
                    <th>#</th>
                    <th>اسم الزبون</th>
                    <th>دولار لنا</th>
                    <th>دولار له</th>
                    <th>سوري لنا</th>
                    <th>سوري له</th>
                    ${customColumns.map((col, idx) => `<th class="custom-col-header">${col.label} لنا <button class="small-x" onclick="removeCustomColumn(${idx})">X</button></th><th class="custom-col-header">${col.label} له <button class="small-x" onclick="removeCustomColumn(${idx})">X</button></th>`).join('')}
                    <th>ملاحظات</th>
                    <th>تعديل</th>
                    <th>حذف</th>
                </tr>
            `;

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (displayedCustomers.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" style="text-align: center; color: #aaa;">لا يوجد زبائن</td></tr>';
                return;
            }

            displayedCustomers.forEach((cust, index) => {
                const actualIndex = customers.indexOf(cust);
                const row = tbody.insertRow();
                
                if (editingIndex === actualIndex) {
                    row.className = 'edit-mode';
                    row.innerHTML = `
                        <td>${actualIndex + 1}</td>
                        <td style="text-align: right;">${cust.name}</td>
                        <td><input type="number" class="edit-input" id="edit_usd_us" value="${cust.usd_for_us}"></td>
                        <td><input type="number" class="edit-input" id="edit_usd_him" value="${cust.usd_for_him}"></td>
                        <td><input type="number" class="edit-input" id="edit_syp_us" value="${cust.syp_for_us}"></td>
                        <td><input type="number" class="edit-input" id="edit_syp_him" value="${cust.syp_for_him}"></td>
                    `;

                    customColumns.forEach(col => {
                        const data = cust.customData[col.id] || { us: 0, him: 0 };
                        row.innerHTML += `<td><input type="number" class="edit-input" id="edit_${col.id}_us" value="${data.us}"></td>`;
                        row.innerHTML += `<td><input type="number" class="edit-input" id="edit_${col.id}_him" value="${data.him}"></td>`;
                    });

                    row.innerHTML += `
                        <td>${cust.notes}</td>
                        <td><button class="btn btn-gold" style="padding: 4px 8px; font-size: 12px;" onclick="saveEdit(${actualIndex})">✅ حفظ</button></td>
                        <td></td>
                    `;
                } else {
                    row.innerHTML = `
                        <td>${actualIndex + 1}</td>
                        <td class="td-name">${cust.name}</td>
                        <td class="money-td">${cust.usd_for_us.toLocaleString()}</td>
                        <td class="money-td">${cust.usd_for_him.toLocaleString()}</td>
                        <td class="money-td">${cust.syp_for_us.toLocaleString()}</td>
                        <td class="money-td">${cust.syp_for_him.toLocaleString()}</td>
                    `;

                    customColumns.forEach(col => {
                        const data = cust.customData[col.id] || { us: 0, him: 0 };
                        row.innerHTML += `<td class="money-td">${data.us.toLocaleString()}</td>`;
                        row.innerHTML += `<td class="money-td">${data.him.toLocaleString()}</td>`;
                    });

                    row.innerHTML += `
                        <td>${cust.notes}</td>
                        <td><button class="btn btn-gold" style="padding: 4px 8px; font-size: 12px;" onclick="startEdit(${actualIndex})">✏️ تعديل</button></td>
                        <td><button class="btn btn-red" style="padding: 4px 8px; font-size: 12px;" onclick="deleteCustomer(${actualIndex})">✖</button></td>
                    `;
                }
            });

            updateTotals();
        }

        // بدء تعديل
        function startEdit(index) {
            editingIndex = index;
            renderTable();
        }

        // حفظ التعديل
        function saveEdit(index) {
            const state = JSON.parse(localStorage.getItem('customers_ledger'));
            const cust = state.customers[index];

            cust.usd_for_us = parseFloat(document.getElementById('edit_usd_us').value) || 0;
            cust.usd_for_him = parseFloat(document.getElementById('edit_usd_him').value) || 0;
            cust.syp_for_us = parseFloat(document.getElementById('edit_syp_us').value) || 0;
            cust.syp_for_him = parseFloat(document.getElementById('edit_syp_him').value) || 0;

            customColumns.forEach(col => {
                cust.customData[col.id] = {
                    us: parseFloat(document.getElementById('edit_' + col.id + '_us').value) || 0,
                    him: parseFloat(document.getElementById('edit_' + col.id + '_him').value) || 0
                };
            });

            localStorage.setItem('customers_ledger', JSON.stringify(state));
            editingIndex = -1;
            renderTable();
        }

        // حذف زبون
        function deleteCustomer(index) {
            if (confirm("هل تريد حذف هذا الزبون؟")) {
                const state = JSON.parse(localStorage.getItem('customers_ledger'));
                state.customers.splice(index, 1);
                localStorage.setItem('customers_ledger', JSON.stringify(state));
                editingIndex = -1;
                renderTable();
            }
        }

        // تحديث الإجماليات
        function updateTotals() {
            const state = JSON.parse(localStorage.getItem('customers_ledger')) || { customColumns: [], customers: [] };
            const customers = state.customers;
            customColumns = state.customColumns;

            if (customers.length === 0) return;

            let tUsdUs = 0, tUsdHim = 0, tSypUs = 0, tSypHim = 0;
            let customTotals = {};

            customColumns.forEach(col => {
                customTotals[col.id] = { us: 0, him: 0 };
            });

            customers.forEach(cust => {
                tUsdUs += cust.usd_for_us;
                tUsdHim += cust.usd_for_him;
                tSypUs += cust.syp_for_us;
                tSypHim += cust.syp_for_him;

                customColumns.forEach(col => {
                    const data = cust.customData[col.id] || { us: 0, him: 0 };
                    customTotals[col.id].us += data.us;
                    customTotals[col.id].him += data.him;
                });
            });

            const tfoot = document.getElementById('tableFooter');
            tfoot.innerHTML = `
                <tr class="totals-row">
                    <td colspan="2">الإجمالي الكلي</td>
                    <td>${tUsdUs.toLocaleString()}</td>
                    <td>${tUsdHim.toLocaleString()}</td>
                    <td>${tSypUs.toLocaleString()}</td>
                    <td>${tSypHim.toLocaleString()}</td>
                    ${customColumns.map(col => `<td>${customTotals[col.id].us.toLocaleString()}</td><td>${customTotals[col.id].him.toLocaleString()}</td>`).join('')}
                    <td colspan="3"></td>
                </tr>
                <tr class="net-row">
                    <td colspan="2">الصافي (لنا - له)</td>
                    <td style="color: var(--green);">${(tUsdUs - tUsdHim).toLocaleString()}</td>
                    <td></td>
                    <td style="color: var(--green);">${(tSypUs - tSypHim).toLocaleString()}</td>
                    <td></td>
                    ${customColumns.map(col => `<td style="color: var(--gold);">${(customTotals[col.id].us - customTotals[col.id].him).toLocaleString()}</td><td></td>`).join('')}
                    <td colspan="3"></td>
                </tr>
            `;
        }

        // البحث
        function searchCustomer() {
            searchQuery = document.getElementById('searchInput').value;
            renderTable();
        }

        // تحميل عند الفتح
        window.onload = function() {
            loadData();
        };

        function loadData() {
            const state = JSON.parse(localStorage.getItem('customers_ledger'));
            if (state) {
                customColumns = state.customColumns || [];
                loadCustomInputs();
                renderTable();
            } else {
                loadCustomInputs();
                renderTable();
            }
        }

        // إضافة زبون عند الضغط على Enter
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                registerCustomer();
            }
        });
    </script>
</body>
</html>
